[package]
name = "claude-sessions"
version = "0.2.0"
edition = "2021"
description = "Find, relaunch, back up and export Claude Code sessions"
license = "MIT"
repository = "https://github.com/YOUR-USER/claude-sessions"
default-run = "claude-sessions"

[lib]
name = "claude_sessions"
path = "src/lib.rs"

[[bin]]
name = "claude-sessions"
path = "src/main.rs"

[[bin]]
name = "claude-sessions-cli"
path = "src/bin/cli.rs"

[dependencies]
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "clipboard", "glow", "wayland", "x11"] }
egui_extras = { version = "0.37", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
rfd = { version = "0.17", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
